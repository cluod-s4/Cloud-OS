# infra/kubernetes/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-os-backend
  namespace: cloud-os
  labels:
    app: cloud-os
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloud-os
      component: backend
  template:
    metadata:
      labels:
        app: cloud-os
        component: backend
    spec:
      containers:
      - name: backend
        image: cloud-os-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://cloud_os:${DB_PASSWORD}@postgres:5432/cloud_os"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: cloud-os-secrets
              key: secret_key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
